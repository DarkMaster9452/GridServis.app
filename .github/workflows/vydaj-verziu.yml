name: Vydaj verziu

# Spustí sa, keď na GitHube spravíš Release (Draft alebo Publish → Publish release).
# Tag releasu musí byť napr. v2.2.6 alebo 2.2.6 — "v" na začiatku sa odstráni.
# Priprav k releasu súbor GridServisSetup.exe ako asset.
#
# Čo urobí:
#   1. stiahne GridServisSetup.exe z tohto releasu
#   2. spočíta jeho SHA-256 a veľkosť
#   3. zapíše riadok do tabuľky `verzie` v Neone (rovnaká funkcia ako admin.vydaj_verziu)
#
# Nová verzia sa zapíše ako NEAKTÍVNA (aktivna = false) — dielňam sa zatiaľ neponúka.
# V admine v Verziách klikneš "Zapnúť / vypnúť ponúkanie" a až vtedy sa reálne vydá.
# Ak chceš, aby sa zapla hneď automaticky, daj do popisu releasu na GitHube text [zapnut].
# Ak má byť aktualizácia povinná (appka ju nedá preskočiť), daj do popisu [povinna].

on:
  release:
    types: [published]

jobs:
  zapis-verziu:
    runs-on: ubuntu-latest
    steps:
      - name: Priprav premenné
        id: info
        run: |
          VERZIA="${GITHUB_REF_NAME#v}"
          echo "verzia=$VERZIA" >> "$GITHUB_OUTPUT"

          POVINNA=false
          if echo "${{ github.event.release.body }}" | grep -qi '\[povinna\]'; then
            POVINNA=true
          fi
          echo "povinna=$POVINNA" >> "$GITHUB_OUTPUT"

          AKTIVNA=false
          if echo "${{ github.event.release.body }}" | grep -qi '\[zapnut\]'; then
            AKTIVNA=true
          fi
          echo "aktivna=$AKTIVNA" >> "$GITHUB_OUTPUT"

      - name: Nájdi GridServisSetup.exe v assetoch releasu
        id: asset
        run: |
          URL=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "${{ github.event.release.assets_url }}" \
            | grep -o '"browser_download_url": *"[^"]*GridServisSetup\.exe"' \
            | sed -E 's/.*"(https[^"]+)"/\1/')
          if [ -z "$URL" ]; then
            echo "::error::V assetoch releasu som nenašiel GridServisSetup.exe"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Stiahni inštalačku a spočítaj SHA-256
        id: subor
        run: |
          curl -sL -o GridServisSetup.exe "${{ steps.asset.outputs.url }}"
          SHA=$(sha256sum GridServisSetup.exe | cut -d' ' -f1)
          VELKOST=$(stat -c%s GridServisSetup.exe)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "velkost=$VELKOST" >> "$GITHUB_OUTPUT"

      - name: Ulož poznámky releasu do súboru
        # cez súbor, nie priamo do príkazu — text releasu môže obsahovať čokoľvek
        # (apostrofy, úvodzovky, nové riadky) a takto to nič nerozbije
        run: |
          cat > poznamky.txt <<'GRIDSERVIS_EOF'
          ${{ github.event.release.body }}
          GRIDSERVIS_EOF
          # odstránime riadiace značky, nech ich dielňa v okne aktualizácie nevidí
          sed -i -E 's/\[(povinna|zapnut)\]//gi' poznamky.txt

      - name: Zapíš do databázy (Neon)
        run: |
          pip install --quiet psycopg2-binary
          python3 <<'PYEOF'
          import os
          import psycopg2

          with open("poznamky.txt", encoding="utf-8") as f:
              poznamky = f.read().strip()

          conn = psycopg2.connect(os.environ["DATABASE_URL"], connect_timeout=10)
          with conn, conn.cursor() as cur:
              cur.execute(
                  """INSERT INTO verzie (verzia, url, sha256, velkost, poznamky,
                                        povinna, aktivna, plati_od)
                     VALUES (%s, %s, %s, %s, %s, %s, %s, now())
                     ON CONFLICT (verzia) DO UPDATE SET
                       url = EXCLUDED.url, sha256 = EXCLUDED.sha256,
                       velkost = EXCLUDED.velkost, poznamky = EXCLUDED.poznamky,
                       povinna = EXCLUDED.povinna, vydane = now()""",
                  (
                      os.environ["VERZIA"], os.environ["URL"], os.environ["SHA256"],
                      int(os.environ["VELKOST"]), poznamky,
                      os.environ["POVINNA"] == "true", os.environ["AKTIVNA"] == "true",
                  ),
              )
          print("Zapísané.")
          PYEOF
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VERZIA: ${{ steps.info.outputs.verzia }}
          URL: ${{ steps.asset.outputs.url }}
          SHA256: ${{ steps.subor.outputs.sha256 }}
          VELKOST: ${{ steps.subor.outputs.velkost }}
          POVINNA: ${{ steps.info.outputs.povinna }}
          AKTIVNA: ${{ steps.info.outputs.aktivna }}

      - name: Zhrnutie
        run: |
          echo "### Verzia ${{ steps.info.outputs.verzia }} zapísaná" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256: \`${{ steps.subor.outputs.sha256 }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Veľkosť: ${{ steps.subor.outputs.velkost }} B" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ponúka sa dielňam: **${{ steps.info.outputs.aktivna }}**" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.info.outputs.aktivna }}" = "false" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "👉 Zapni ju v admine: Verzie → **Zapnúť / vypnúť ponúkanie**." >> "$GITHUB_STEP_SUMMARY"
          fi
